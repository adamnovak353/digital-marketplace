name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @marketplace/domain test
      - run: pnpm --filter @marketplace/domain typecheck
      - run: pnpm --filter @marketplace/web build
      - run: pnpm --filter @marketplace/api typecheck
      - run: pnpm --filter @marketplace/worker typecheck
